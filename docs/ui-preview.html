<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green ERP — Phase 1 Console</title>
</head>
<body>

<style>
  /* ---------------------------------------------------------------- tokens */
  :root {
    --paper:        #F6F7F4;
    --surface:      #FFFFFF;
    --surface-2:    #EFF1EC;
    --line:         #DDE2D9;
    --line-strong:  #C6CDC0;

    --ink:          #101711;
    --ink-2:        #4A5450;
    --ink-3:        #79837D;

    --pine:         #1F6B4A;
    --pine-ink:     #144231;
    --pine-wash:    #E4F0E9;

    --ok:           #2E7D5B;
    --warn:         #8A5F07;
    --crit:         #A93521;
    --info:         #2A5F8F;
    --wash-ok:      #E2F0E8;
    --wash-warn:    #F6EBD4;
    --wash-crit:    #F7E4E0;
    --wash-info:    #E3EDF6;
    --wash-mute:    #E9ECE6;

    --ui:   ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;

    --r: 10px;
    --shadow: 0 1px 2px rgba(16, 23, 17, .05), 0 4px 14px -8px rgba(16, 23, 17, .10);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0D1310;  --surface: #141C17;  --surface-2: #1B241E;
      --line: #26302A;   --line-strong: #35413A;
      --ink: #E8EEE9;    --ink-2: #A3AFA8;    --ink-3: #78857D;
      --pine: #56B98A;   --pine-ink: #9BDCBB; --pine-wash: #16291F;
      --ok: #5DBE90;     --warn: #D8A63C;     --crit: #E2705A;  --info: #6FA8D8;
      --wash-ok: #142A20; --wash-warn: #2C2415; --wash-crit: #2E1B17;
      --wash-info: #16242F; --wash-mute: #1D251F;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px -8px rgba(0,0,0,.6);
    }
  }

  /* The viewer's explicit toggle must beat the OS preference in both directions. */
  :root[data-theme="light"] {
    --paper: #F6F7F4;  --surface: #FFFFFF;  --surface-2: #EFF1EC;
    --line: #DDE2D9;   --line-strong: #C6CDC0;
    --ink: #101711;    --ink-2: #4A5450;    --ink-3: #79837D;
    --pine: #1F6B4A;   --pine-ink: #144231; --pine-wash: #E4F0E9;
    --ok: #2E7D5B;     --warn: #8A5F07;     --crit: #A93521;  --info: #2A5F8F;
    --wash-ok: #E2F0E8; --wash-warn: #F6EBD4; --wash-crit: #F7E4E0;
    --wash-info: #E3EDF6; --wash-mute: #E9ECE6;
    --shadow: 0 1px 2px rgba(16,23,17,.05), 0 4px 14px -8px rgba(16,23,17,.10);
  }
  :root[data-theme="dark"] {
    --paper: #0D1310;  --surface: #141C17;  --surface-2: #1B241E;
    --line: #26302A;   --line-strong: #35413A;
    --ink: #E8EEE9;    --ink-2: #A3AFA8;    --ink-3: #78857D;
    --pine: #56B98A;   --pine-ink: #9BDCBB; --pine-wash: #16291F;
    --ok: #5DBE90;     --warn: #D8A63C;     --crit: #E2705A;  --info: #6FA8D8;
    --wash-ok: #142A20; --wash-warn: #2C2415; --wash-crit: #2E1B17;
    --wash-info: #16242F; --wash-mute: #1D251F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px -8px rgba(0,0,0,.6);
  }

  /* ------------------------------------------------------------------ base */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .tnum { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  .code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }

  a { color: var(--pine); text-decoration: none; }
  a:hover { text-decoration: underline; }

  :focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; border-radius: 4px; }

  /* ---------------------------------------------------------------- banner */
  .banner { background: var(--surface); border-bottom: 1px solid var(--line); padding: 18px 24px; }
  .banner-inner {
    max-width: 1320px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
  }
  .banner h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .banner p  { margin: 0; color: var(--ink-3); font-size: 13px; }
  .spacer { flex: 1 1 auto; }

  /* Structural device: each surface cites the spec clause it implements. */
  .cite {
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-3); background: var(--wash-mute);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 8px; white-space: nowrap;
  }

  /* ----------------------------------------------------------------- shell */
  .console { max-width: 1320px; margin: 24px auto 56px; padding: 0 24px; }

  .frame {
    display: grid; grid-template-columns: 224px minmax(0, 1fr);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ------------------------------------------------------------------ rail */
  .rail { border-inline-end: 1px solid var(--line); padding-bottom: 20px; }

  .brand { padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
  .brand-sub  { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

  .rail-group { padding: 14px 10px 0; }
  .rail-label {
    font-size: 10px; font-weight: 650; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-3); padding: 0 8px 6px;
  }
  .rail-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: start;
    padding: 6px 8px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink-2);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .rail-item:hover { background: var(--surface-2); color: var(--ink); }
  .rail-item.is-active { background: var(--pine-wash); color: var(--pine-ink); font-weight: 600; }
  .rail-item .n {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .rail-item.is-active .n { color: var(--pine-ink); }
  .rail-item.is-locked { color: var(--ink-3); cursor: default; }
  .rail-item.is-locked:hover { background: transparent; color: var(--ink-3); }
  .rail-item.is-locked .n { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }

  /* ---------------------------------------------------------------- topbar */
  .pane { min-width: 0; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; gap: 12px; padding: 11px 20px; border-bottom: 1px solid var(--line); }
  .who-org  { font-size: 13px; font-weight: 600; }
  .who-role { font-size: 11px; color: var(--ink-3); }

  .toggle {
    display: inline-flex; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px;
  }
  .toggle button {
    font: inherit; font-size: 12px; font-weight: 550;
    color: var(--ink-2); background: transparent; border: 0;
    cursor: pointer; padding: 4px 11px; border-radius: 6px;
  }
  .toggle button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  /* ------------------------------------------------------------------ body */
  .content { padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto; }

  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .crumbs button {
    font: inherit; background: none; border: 0; padding: 0;
    color: var(--pine); cursor: pointer;
  }
  .crumbs button:hover { text-decoration: underline; }

  .page-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 12px; }
  .page-head h2 { margin: 0; font-size: 17px; font-weight: 620; letter-spacing: -0.015em; }
  .page-head p  { margin: 0; font-size: 13px; color: var(--ink-3); }

  /* --------------------------------------------------------------- kpi row */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .kpi {
    position: relative; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r);
    padding: 13px 15px; overflow: hidden;
    text-align: start; font: inherit; color: inherit; cursor: pointer;
  }
  .kpi:hover { border-color: var(--line-strong); }
  /* Severity stripe: state readable before the number is parsed. */
  .kpi::before {
    content: ""; position: absolute; inset-block: 0; inset-inline-start: 0;
    width: 3px; background: var(--line-strong);
  }
  .kpi[data-state="ok"]::before   { background: var(--ok); }
  .kpi[data-state="warn"]::before { background: var(--warn); }
  .kpi[data-state="crit"]::before { background: var(--crit); }

  .kpi-label { font-size: 10px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .kpi-value { font-size: 27px; font-weight: 640; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; margin-top: 5px; line-height: 1.1; }
  .kpi-note  { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

  /* ----------------------------------------------------------------- cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-bottom: 1px solid var(--line); }
  .card-head h3 { margin: 0; font-size: 13px; font-weight: 620; }

  .split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
  .split-even { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .detail-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }

  /* ---------------------------------------------------------------- tables */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: start; font-size: 10px; font-weight: 650;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3);
    background: var(--surface-2); padding: 7px 14px;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: end; font-variant-numeric: tabular-nums; }

  tr.row-link { cursor: pointer; }
  tr.row-link:hover td { background: var(--surface-2); }

  .empty { padding: 46px 16px; text-align: center; color: var(--ink-3); font-size: 13px; }

  /* ----------------------------------------------------------------- pills */
  .pill { display: inline-block; font-size: 11px; font-weight: 560; padding: 1.5px 8px; border-radius: 999px; white-space: nowrap; }
  .pill-ok    { background: var(--wash-ok);   color: var(--ok); }
  .pill-warn  { background: var(--wash-warn); color: var(--warn); }
  .pill-crit  { background: var(--wash-crit); color: var(--crit); }
  .pill-info  { background: var(--wash-info); color: var(--info); }
  .pill-mute  { background: var(--wash-mute); color: var(--ink-2); }
  .pill-brand { background: var(--pine-wash); color: var(--pine-ink); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }

  /* ----------------------------------------------------------------- notice */
  .notice { border-radius: var(--r); padding: 11px 14px; font-size: 12.5px; line-height: 1.55; }
  .notice-info  { background: var(--wash-info); color: var(--info); }
  .notice-warn  { background: var(--wash-warn); color: var(--warn); }
  .notice-crit  { background: var(--wash-crit); color: var(--crit); }
  .notice b { font-weight: 650; }

  /* ------------------------------------------------------------- definition */
  dl.details { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 28px; }
  dl.details > div { border-bottom: 1px solid var(--line); padding: 8px 0; }
  dl.details dt { font-size: 11px; color: var(--ink-3); }
  dl.details dd { margin: 2px 0 0; font-size: 13px; }

  /* ---------------------------------------------------------------- matrix */
  table.matrix { font-size: 12.5px; }
  table.matrix th.perm, table.matrix td.perm {
    position: sticky; inset-inline-start: 0; z-index: 2;
    background: var(--surface); min-width: 258px;
  }
  table.matrix th.perm { background: var(--surface-2); z-index: 3; }
  table.matrix tr:hover td.perm { background: var(--surface-2); }
  table.matrix th.role {
    text-align: center; font-size: 10px; padding: 7px 6px;
    max-width: 94px; white-space: normal; line-height: 1.25;
  }
  table.matrix td.cell { text-align: center; padding: 7px 6px; }

  .module-row td {
    background: var(--pine-wash); color: var(--pine-ink);
    font-size: 10px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; padding: 4px 14px;
  }
  .perm-label { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .perm-code  { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); display: block; margin-top: 1px; }

  .mark { font-size: 13px; line-height: 1; }
  .mark-yes  { color: var(--ok);   font-weight: 700; }
  .mark-sens { color: var(--warn); font-weight: 700; }
  .mark-no   { color: var(--line-strong); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 16px;
    padding: 9px 15px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-3);
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 15px; border-bottom: 1px solid var(--line); }
  .toolbar input {
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; max-width: 260px; width: 100%;
  }
  .toolbar input::placeholder { color: var(--ink-3); }

  /* ----------------------------------------------------------- phase ledger */
  .phase {
    display: grid; grid-template-columns: 30px minmax(0, 1fr) auto;
    align-items: center; gap: 12px;
    padding: 9px 15px; border-bottom: 1px solid var(--line);
  }
  .phase:last-child { border-bottom: 0; }
  .phase-n { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .phase-name { font-size: 13px; }
  .phase.is-done .phase-name { font-weight: 600; }
  .phase-spec { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }

  /* ------------------------------------------------------------------- foot */
  .foot {
    max-width: 1320px; margin: 0 auto; padding: 20px 24px 0;
    font-size: 12px; color: var(--ink-3);
    display: flex; flex-wrap: wrap; gap: 6px 18px;
  }

  /* -------------------------------------------------------------- responsive */
  @media (max-width: 980px) {
    .frame { grid-template-columns: minmax(0, 1fr); }
    .rail { border-inline-end: 0; border-bottom: 1px solid var(--line); }
    .split, .split-even, .detail-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .console { padding: 0 12px; margin-top: 14px; }
    .banner { padding: 14px 16px; }
    .content { padding: 14px; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .theme-btn {
    position: fixed; inset-block-start: 12px; inset-inline-end: 12px; z-index: 50;
    font: inherit; font-size: 12px; font-weight: 550;
    color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 11px; cursor: pointer;
    box-shadow: var(--shadow);
  }
  .theme-btn:hover { color: var(--ink); }
</style>


<button type="button" class="theme-btn" id="theme-btn">Theme</button>

<div class="banner">
  <div class="banner-inner">
    <h1>Green ERP — Phase 1 console</h1>
    <span class="cite">§1 · §2</span>
    <span class="spacer"></span>
    <p id="banner-note">Clickable preview · every screen shipped in Phase 1</p>
  </div>
</div>

<div class="console">
  <div class="frame" id="frame" dir="ltr" lang="en">
    <nav class="rail" id="rail" aria-label="Sections"></nav>

    <div class="pane">
      <div class="topbar">
        <div>
          <div class="who-org"  id="who-org">Delta Fulfillment Co.</div>
          <div class="who-role" id="who-role">Operations Manager · Cairo</div>
        </div>
        <span class="spacer"></span>
        <div class="toggle" role="group" aria-label="Language and direction">
          <button type="button" id="btn-en" aria-pressed="true">EN</button>
          <button type="button" id="btn-ar" aria-pressed="false">العربية</button>
        </div>
      </div>

      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div class="foot">
  <span id="foot-note">Preview only — no live data. The running app renders these screens from Supabase under row-level security.</span>
  <span class="cite">§1.9</span>
</div>

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  var merchant  = function (id) { return byId(DB.merchants, id); };
  var store     = function (id) { return byId(DB.stores, id); };
  var user      = function (id) { return byId(DB.users, id); };
  var role      = function (id) { return byId(DB.roles, id); };
  var warehouse = function (id) { return byId(DB.warehouses, id); };
  var dept      = function (id) { return byId(DB.departments, id); };
  var shift     = function (id) { return byId(DB.shifts, id); };
  var team      = function (id) { return byId(DB.teams, id); };

  function storesOf(mid) { return DB.stores.filter(function (s) { return s.merchant === mid; }); }
  function syncOf(sid)   { return DB.sync.filter(function (r) { return r.store === sid; }); }
  function usersOfRole(rid) { return DB.users.filter(function (u) { return u.roles.indexOf(rid) !== -1; }); }

  /* ====================================================================== *
   * Rendering helpers                                                       *
   * ====================================================================== */

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function statusPill(key) {
    var s = STATUS[key];
    if (!s) return '<span class="pill pill-mute">' + esc(key) + '</span>';
    return '<span class="pill pill-' + s.tone + '">' + esc(L(s)) + '</span>';
  }

  function head(title, subtitle, cite) {
    return '<div class="page-head">' +
      '<h2>' + esc(title) + '</h2>' +
      (cite ? '<span class="cite">' + esc(cite) + '</span>' : '') +
      '<span class="spacer"></span>' +
      (subtitle ? '<p>' + esc(subtitle) + '</p>' : '') +
      '</div>';
  }

  function crumbs(trail) {
    var parts = [];
    for (var i = 0; i < trail.length; i++) {
      if (trail[i].route) {
        parts.push('<button type="button" data-go="' + esc(trail[i].route) + '">' + esc(trail[i].label) + '</button>');
      } else {
        parts.push('<span>' + esc(trail[i].label) + '</span>');
      }
    }
    return '<div class="crumbs">' + parts.join('<span>›</span>') + '</div>';
  }

  function card(title, cite, inner, footer) {
    return '<section class="card">' +
      '<div class="card-head"><h3>' + esc(title) + '</h3><span class="spacer"></span>' +
      (cite ? '<span class="cite">' + esc(cite) + '</span>' : '') + '</div>' +
      inner +
      (footer ? '<div class="legend">' + footer + '</div>' : '') +
      '</section>';
  }

  function table(headers, rows) {
    if (!rows.length) return '<div class="empty">' + esc(t('noResults')) + '</div>';
    var th = headers.map(function (h) {
      return '<th' + (h.num ? ' class="num"' : '') + '>' + esc(h.label) + '</th>';
    }).join('');
    return '<div class="scroll"><table><thead><tr>' + th + '</tr></thead><tbody>' +
      rows.join('') + '</tbody></table></div>';
  }

  function row(cells, route) {

    var codes = {};
    u.roles.forEach(function (rid) {
      (DB.grants[rid] || []).forEach(function (c) { codes[c] = true; });
    });
    var permList = Object.keys(codes);

    var permRows = [];
    DB.modules.forEach(function (mod) {
      mod.perms.forEach(function (p) {
        if (!codes[p.code]) return;
        permRows.push(row([
          { text: mod.name, cls: 'muted' },
          { html: esc(L(p.label)) + (p.sensitive ? ' <span class="pill pill-warn">' + esc(t('sensitive')) + '</span>' : '') },
          { text: p.code, cls: 'code' }
        ]));
      });
    });

    /* Field policies resolve to the most restrictive across the user's roles. */
    var fps = [];
    u.roles.forEach(function (rid) {
      (DB.fieldPolicies[rid] || []).forEach(function (fp) { fps.push(fp); });
    });

    var fieldRows = fps.map(function (fp) {
      return row([

      card(t('tabPerms') + (granted ? ' · ' + granted.length : ''), '§2.7.1',
        permRows.length
          ? table([{ label: t('module') }, { label: t('permission') }, { label: 'Code' }], permRows)
          : '<div class="empty">' + esc(t('noResults')) + '</div>') +
      card(t('colUsers'), null,
        table([{ label: t('name') }, { label: t('colJobTitle') }, { label: t('status') }], holderRows));
  };

  VIEWS.matrix = function (q) {
    var roles = DB.matrixRoles.map(role);

    var headCells = roles.map(function (r) {
      return '<th class="role">' + esc(L(r.name)) + '</th>';
    }).join('');

    var body = '';
    DB.modules.forEach(function (mod) {
      var perms = mod.perms.filter(function (p) {
        if (!q) return true;
        var hay = (p.code + ' ' + L(p.label) + ' ' + mod.name).toLowerCase();
        return hay.indexOf(q.toLowerCase()) !== -1;
      });
      if (!perms.length) return;

      body += '<tr class="module-row"><td colspan="' + (roles.length + 1) + '">' + esc(mod.name) + '</td></tr>';

      perms.forEach(function (p) {
        var cells = roles.map(function (r) {
          var has = (DB.grants[r.id] || []).indexOf(p.code) !== -1;
          var fp = (DB.fieldPolicies[r.id] || []).filter(function (f) {
            return p.code === 'customers.view_phone' && f.field === 'phone';
          })[0];

          if (fp && !has) {
            return '<td class="cell"><span class="pill pill-mute">' + esc(t(fp.visibility)) + '</span></td>';
          }
          if (has && fp) {
            return '<td class="cell"><span class="pill pill-mute">' + esc(t(fp.visibility)) + '</span></td>';
          }
          return '<td class="cell"><span class="mark ' + (has ? (p.sensitive ? 'mark-sens' : 'mark-yes') : 'mark-no') + '">' +
                 (has ? '✓' : '–') + '</span></td>';
        }).join('');

        body += '<tr><td class="perm"><span class="perm-label">' + esc(L(p.label)) +
          (p.sensitive ? '<span class="pill pill-warn">' + esc(t('sensitive')) + '</span>' : '') +
          (p.approval ? '<span class="pill pill-crit">' + esc(t('dualControl')) + '</span>' : '') +
          '</span><code class="perm-code">' + esc(p.code) + '</code></td>' + cells + '</tr>';
      });
    });

    return head(t('matrix'), t('subMatrix'), '§2.7.1') +
      notice('info', null, t('matrixNote')) +
      '<section class="card">' +
        '<div class="toolbar"><input type="search" id="q" placeholder="' + esc(t('search')) + '" value="' + esc(q || '') + '"></div>' +
        '<div class="scroll"><table class="matrix"><thead><tr>' +
          '<th class="perm">' + esc(t('colPermission')) + '</th>' + headCells +
        '</tr></thead><tbody>' + (body || '') + '</tbody></table></div>' +
        (body ? '' : '<div class="empty">' + esc(t('noResults')) + '</div>') +
        '<div class="legend">' +
          '<span><span class="mark mark-yes">✓</span> ' + esc(t('granted')) + '</span>' +
          '<span><span class="mark mark-sens">✓</span> ' + esc(t('grantedSens')) + '</span>' +
          '<span>' + esc(t('sodNote')) + '</span>' +
          '<span class="spacer"></span><span class="cite">§2.7.4</span>' +
        '</div>' +
      '</section>';
  };

  VIEWS.departments = function () {
    var rows = DB.departments.map(function (d) {
      var m = d.manager ? user(d.manager) : null;
      return row([
        { text: d.code, cls: 'tnum' },
        { html: '<strong>' + esc(L(d.name)) + '</strong>' },
        { html: m ? '<a href="#" data-go="user/' + esc(m.id) + '">' + esc(L(m.name)) + '</a>' : '<span class="muted">—</span>' },
        { text: d.teams, cls: 'num tnum' },
        { html: statusPill(d.active ? 'active' : 'archived') }
      ]);
    });

    return head(t('departments'), t('subDepartments'), '§2.8.1') +
      card(t('departments'), null, table([
        { label: t('code') }, { label: t('name') }, { label: t('colManager') },
        { label: t('colTeams'), num: true }, { label: t('status') }
      ], rows));
  };

  VIEWS.teams = function () {
    var rows = DB.teams.map(function (tm) {
      var d = tm.dept ? dept(tm.dept) : null;
      var l = tm.leader ? user(tm.leader) : null;
      var sh = tm.shift ? shift(tm.shift) : null;
      return row([
        { text: tm.code, cls: 'tnum' },
        { html: '<strong>' + esc(L(tm.name)) + '</strong>' },
        { text: d ? L(d.name) : '—', cls: 'muted' },
        { html: l ? '<a href="#" data-go="user/' + esc(l.id) + '">' + esc(L(l.name)) + '</a>' : '—' },
        { text: tm.members, cls: 'num tnum' },
        { text: sh ? L(sh.name) : '—', cls: 'muted' },
        { html: tm.regions.length ? esc(tm.regions.join(', ')) : '<span class="muted">' + esc(t('all')) + '</span>' }
      ]);
    });

    return head(t('teams'), t('subTeams'), '§2.8.2') +
      card(t('teams'), null, table([
        { label: t('code') }, { label: t('name') }, { label: t('colDepartment') },
        { label: t('colLeader') }, { label: t('colMembers'), num: true },
        { label: t('shifts') }, { label: t('colRegions') }
      ], rows));
  };

  VIEWS.shifts = function () {
    var DAYS = { en: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], ar: ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'] };
    var rows = DB.shifts.map(function (sh) {
      var d = sh.dept ? dept(sh.dept) : null;
      return row([
        { html: '<strong>' + esc(L(sh.name)) + '</strong>' },
        { html: '<span dir="ltr" class="tnum">' + esc(sh.start + ' – ' + sh.end) + '</span>', cls: 'muted' },
        { text: sh.days.map(function (i) { return DAYS[LANG][i]; }).join(' '), cls: 'muted' },
        { text: d ? L(d.name) : '—', cls: 'muted' },
        { text: sh.members, cls: 'num tnum' },
        { text: sh.capacity, cls: 'num tnum muted' },
        { html: statusPill(sh.active ? 'active' : 'archived') }
      ]);
    });

    return head(t('shifts'), t('subShifts'), '§2.8.3') +
      card(t('shifts'), null, table([
        { label: t('name') }, { label: t('colHours') }, { label: t('colDays') },
        { label: t('colDepartment') }, { label: t('colMembers'), num: true },
        { label: t('colCapacity'), num: true }, { label: t('status') }
      ], rows));
  };

  VIEWS.sync = function () {
    var rows = DB.sync.map(function (r) {
      var s = store(r.store);
      var u = r.by ? user(r.by) : null;
      return row([
        { text: r.at, cls: 'muted tnum' },
        { html: s ? '<strong>' + esc(s.name) + '</strong>' : '—' },
        { text: r.entity, cls: 'muted' },
        { text: r.trigger, cls: 'muted' },
        { html: statusPill(r.status) },
        { text: r.inn, cls: 'num tnum' },
        { html: '<span style="color:var(--ok)">' + r.ok + '</span>', cls: 'num tnum' },
        { html: r.fail ? '<span style="color:var(--crit)">' + r.fail + '</span>' : String(r.fail), cls: 'num tnum' },
        { text: r.ms, cls: 'num tnum muted' },
        { text: u ? L(u.name) : '—', cls: 'muted' }
      ], 'store/' + r.store);
    });

    return head(t('syncLog'), t('subSync'), '§2.4.5') +
      card(t('syncLog'), null, table([
        { label: t('colWhen') }, { label: t('colStore') }, { label: t('colEntity') },
        { label: t('colTrigger') }, { label: t('status') }, { label: t('colIn'), num: true },
        { label: t('colOk'), num: true }, { label: t('colFail'), num: true },
        { label: t('colDuration'), num: true }, { label: 'By' }
      ], rows), esc(t('syncNote')));
  };

  VIEWS.audit = function () {
    var rows = DB.audit.map(function (a) {
      var u = a.actor ? user(a.actor) : null;
      var tone = DB.actionTone[a.action] || 'mute';
      return row([
        { text: a.at, cls: 'muted tnum' },
        { html: u ? '<strong>' + esc(L(u.name)) + '</strong>' : '<span class="muted">system</span>' },
        { html: '<span class="pill pill-' + tone + '">' + esc(a.action.replace(/_/g, ' ')) + '</span>' },
        { text: a.module, cls: 'code' },
        { text: a.changed, cls: 'muted code' },
        { html: '<span dir="ltr" class="tnum">' + esc(a.ip) + '</span>', cls: 'muted' }
      ], a.actor ? 'user/' + a.actor : null);
    });

    return head(t('activityLog'), t('subAudit'), '§2.9') +
      card(t('activityLog'), '§2.9.2', table([
        { label: t('colWhen') }, { label: t('colUser') }, { label: t('colAction') },
        { label: t('colModule') }, { label: t('colChanged') }, { label: t('colIp') }
      ], rows), esc(t('auditNote')));
  };

  VIEWS.approvals = function () {
    var rows = DB.approvals.map(function (a) {
      var u = user(a.by);
      return row([
        { text: a.at, cls: 'muted tnum' },
        { html: '<strong>' + esc(L(a.type)) + '</strong>' },
        { text: a.entity, cls: 'code' },
        { html: u ? '<a href="#" data-go="user/' + esc(u.id) + '">' + esc(L(u.name)) + '</a>' : '—' },
        { text: L(a.reason), cls: 'muted' },
        { html: statusPill(a.status) }
      ]);
    });

    return head(t('approvals'), t('subApprovals'), '§2.7.4') +
      notice('info', null, t('approvalNote')) +
      card(t('approvals'), null, table([
        { label: t('colWhen') }, { label: t('colType') }, { label: 'Entity' },
        { label: t('colRequestedBy') }, { label: t('colReason') }, { label: t('status') }
      ], rows));
  };

  VIEWS.locked = function (which) {
    var titles = { orders: 'orders', inventory: 'inventory', collections: 'collections', finance: 'finance' };
    var phase  = { orders: 3, inventory: 4, collections: 5, finance: 6 }[which];
    var spec   = { orders: '§4', inventory: '§5', collections: '§6', finance: '§7' }[which];

    return head(t(titles[which]), spec, spec) +
      notice('warn', t('lockedTitle'), t('lockedBody')) +
      card(t('phases'), 'docs/ROADMAP.md',
        '<div>' + DB.phases.filter(function (p) { return p.n === phase; }).map(function (p) {
          return '<div class="phase"><span class="phase-n">' + p.n + '</span>' +
            '<span><span class="phase-name">' + esc(L(p.name)) + '</span>' +
            '<span class="phase-spec">' + esc(p.spec) + '</span></span>' +
            '<span class="pill pill-mute">' + esc(t('planned')) + '</span></div>';
        }).join('') + '</div>');
  };

  function maskPhone(v) {
    if (!v) return '—';
    var digits = v.replace(/\s/g, '');
    if (digits.length <= 5) return '*****';
    return digits.slice(0, 5) + '*****' + digits.slice(-2);
  }

  /* ====================================================================== *
   * Navigation                                                              *
   * ====================================================================== */

  var NAV = [
    { label: 'gAdmin', items: [
      { route: 'companies',  label: 'companies',  n: 1 },
      { route: 'merchants',  label: 'merchants',  n: DB.merchants.length },
      { route: 'stores',     label: 'stores',     n: DB.stores.length },
      { route: 'warehouses', label: 'warehouses', n: DB.warehouses.length }
    ]},
    { label: 'gAccess', items: [
      { route: 'users',  label: 'users',  n: DB.users.length },
      { route: 'roles',  label: 'roles',  n: DB.roles.length },
      { route: 'matrix', label: 'matrix', n: 78 }
    ]},
    { label: 'gOrg', items: [
      { route: 'departments', label: 'departments', n: DB.departments.length },
      { route: 'teams',       label: 'teams',       n: DB.teams.length },
      { route: 'shifts',      label: 'shifts',      n: DB.shifts.length }
    ]},
    { label: 'gMon', items: [
      { route: 'sync',      label: 'syncLog',     n: DB.sync.length },
      { route: 'audit',     label: 'activityLog', n: 318 },
      { route: 'approvals', label: 'approvals',   n: DB.approvals.length }
    ]},
    { label: 'gLater', items: [
      { route: 'locked/orders',      label: 'orders',      n: 'P3' },
      { route: 'locked/inventory',   label: 'inventory',   n: 'P4' },
      { route: 'locked/collections', label: 'collections', n: 'P5' },
      { route: 'locked/finance',     label: 'finance',     n: 'P6' }
    ]}
  ];

  /* Which rail entry lights up for a given route, including detail pages. */
  var PARENT = {
    company: 'companies', merchant: 'merchants', store: 'stores',
    user: 'users', role: 'roles'
  };

  var route = 'dashboard';
  var query = '';

  function renderRail() {
    var current = route.split('/')[0];
    var active = PARENT[current] || current;

    var html = '<div class="brand">' +
      '<div class="brand-name">' + esc(t('brand')) + '</div>' +
      '<div class="brand-sub">' + esc(t('brandSub')) + '</div></div>';

    html += '<div class="rail-group"><button type="button" class="rail-item' +
      (route === 'dashboard' ? ' is-active' : '') + '" data-go="dashboard">' +
      '<span>' + esc(t('dashboard')) + '</span></button></div>';

    NAV.forEach(function (group) {
      html += '<div class="rail-group"><div class="rail-label">' + esc(t(group.label)) + '</div>';
      group.items.forEach(function (item) {
        var isLocked = item.route.indexOf('locked/') === 0;
        var isActive = active === item.route || route === item.route;
        html += '<button type="button" class="rail-item' +
          (isActive ? ' is-active' : '') + (isLocked ? ' is-locked' : '') +
          '" data-go="' + esc(item.route) + '">' +
          '<span>' + esc(t(item.label)) + '</span>' +
          '<span class="n">' + esc(item.n) + '</span></button>';
      });
      html += '</div>';
    });

    document.getElementById('rail').innerHTML = html;
  }

  function renderContent() {
    var parts = route.split('/');
    var view = parts[0];
    var arg = parts[1];

    var fn = VIEWS[view];
    var html = fn ? fn(view === 'locked' ? arg : (arg !== undefined ? arg : query)) : VIEWS.dashboard();

    document.getElementById('content').innerHTML = html;

    var q = document.getElementById('q');
    if (q) {
      q.addEventListener('input', function () {
        query = q.value;
        renderContent();
        var again = document.getElementById('q');
        if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      });
    }
  }

  function renderChrome() {
    document.getElementById('who-org').textContent = t('org');
    document.getElementById('who-role').textContent = t('role');
    document.getElementById('banner-note').textContent = t('bannerNote');
    document.getElementById('foot-note').textContent = t('footNote');
  }

  function go(next) {
    if (next === route) return;
    if (next.indexOf('locked/') !== 0 && next !== route.split('/')[0]) query = '';
    route = next;
    render();

    // Scroll on navigation only. Doing it inside renderContent would also fire
    // on every search keystroke and yank the page out from under the typist.
    var frameEl = document.getElementById('frame');
    if (frameEl && typeof frameEl.scrollIntoView === 'function') {
      frameEl.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }

  function render() {
    renderChrome();
    renderRail();
    renderContent();
  }

  /* One delegated listener covers the rail, KPI tiles, table rows and links. */
  document.addEventListener('click', function (event) {
    var target = event.target.closest ? event.target.closest('[data-go]') : null;
    if (!target) return;
    event.preventDefault();
    go(target.getAttribute('data-go'));
  });

  /* Language switch also flips direction — the layout uses logical properties,
     so nothing needs mirroring by hand. */
  var frame = document.getElementById('frame');
  var btnEn = document.getElementById('btn-en');
  var btnAr = document.getElementById('btn-ar');

  function setLang(lang) {
    LANG = lang;
    var isAr = lang === 'ar';
    frame.setAttribute('dir', isAr ? 'rtl' : 'ltr');
    frame.setAttribute('lang', isAr ? 'ar' : 'en');
    btnEn.setAttribute('aria-pressed', String(!isAr));
    btnAr.setAttribute('aria-pressed', String(isAr));
    render();
  }

  btnEn.addEventListener('click', function () { setLang('en'); });
  btnAr.addEventListener('click', function () { setLang('ar'); });

  render();
})();

  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-btn');
    btn.addEventListener('click', function () {
      var current = root.getAttribute('data-theme');
      if (!current) {
        // Fall back to light when matchMedia is unavailable rather than throwing.
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        current = mq && mq.matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    });
  })();
</script>
